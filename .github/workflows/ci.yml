name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh

  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM 22 and tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 libclang-rt-22-dev ninja-build cmake spirv-tools

      - name: Build fuzzer
        env:
          CC: clang-22
          CXX: clang++-22
          LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
        run: ./scripts/build_directed_fuzzer.sh

      - name: Fuzz smoke run
        env:
          LLVM_OPT: /usr/lib/llvm-22/bin/opt
          FUZZX_FINDINGS_DIR: ${{ github.workspace }}/findings
        run: |
          rc=0
          ./scripts/run_directed_fuzzer.sh -runs=1000 -max_total_time=120 || rc=$?
          # 0 clean exit; 70 libFuzzer error_exitcode; 77 libFuzzer crash report;
          # 134 = 128+SIGABRT from saveFailureFinding. Any of these means the
          # harness ran end-to-end — only earlier startup failures should fail CI.
          case $rc in
            0|70|77|134) echo "fuzzer exited with $rc (acceptable)"; exit 0 ;;
            *) echo "fuzzer exited with unexpected code $rc"; exit $rc ;;
          esac

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: findings
          path: ${{ github.workspace }}/findings
          if-no-files-found: ignore
